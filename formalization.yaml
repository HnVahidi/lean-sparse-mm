version: v0.4
project:
  name: 'lean-sparse-mm: Lean companion for sparse matrix multiplication'
  description: A standalone Lean companion to the included sparse matrix multiplication manuscript.
    The principal result constructs a deterministic supported scalar-message protocol over arbitrary
    semirings, with public masks and original holders, bounded load, balanced chosen output owners,
    correct requested entries and an explicit O(d^(3/2)) round bound. Interpreting scalar messages
    as O(log n)-bit messages retains the manuscript's shared encoding premise; a composed bit-vector
    program is not advertised. Numbered toolbox results are established by separate finite operational
    upper and lower bounds.
  authors:
  - Chetan Gupta
  - Jukka Suomela
  - Hossein Vahidi
  responsible_maintainers:
  - Hossein Vahidi
  license: Apache-2.0
  version: 1.0.0
  doi: 10.5281/zenodo.24127515
  repository: https://github.com/HnVahidi/lean-sparse-mm
classification:
