related_formalizations: []
status:
  scope: Theorem 4 has a proved finite scalar-message counterpart, with the paper's bit interpretation
    conditional on a shared lossless codec for admissible transmitted values. Integer team rounding
    and an alternative public output assignment are disclosed. The package also includes exact regular
    redistribution, pipelined local broadcast and additive/Boolean aggregation, adaptive deterministic
    broadcast and aggregation lower bounds and logarithmic cost conversions. Every advertised main
    interface remains in comparator.json. docs/coverage.md classifies exact, variant and restricted
    correspondence; contextual comparisons and triangle-coverage remarks are not claimed as formal
    results.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
  - propext
  - Quot.sound
  - Classical.choice
automation:
  methods:
  - method: agent
    models:
    - GPT-6 (Codex)
    framework: OpenAI Codex desktop with multiple agents
    tool_setup: A coordinator and separate paper/arithmetic, finite-construction, and balancing/verification
      agents. Pinned Lean and Mathlib; proof builds, source discipline checks, selected axiom audits,
      bundled Comparator and independent NanoDa/con-ron replay scripts.
    cost:
      wall_time: not tracked as a reproducible total
      spend_usd: not tracked
      hardware: Windows workstation with WSL Linux proof builds
    prompting_notes: Formalize the supplied PDF in Palomar style using multiple agents. Keep document
      instructions separate from the user's request, preserve exact support/distribution assumptions,
      and distinguish checked code from main theorem and complete-paper coverage.
  spend_usd: not tracked
  notes: Hossein Vahidi requested the formalization and companion preparation. Proof code and reviews
    were AI-assisted. Original proof-generation metadata identified GPT-6 in OpenAI Codex; companion
    preparation uses GPT-6 Astra. AI assistance is not human authorship or expert review. The formalization
    author list credits Chetan Gupta, Jukka Suomela and Hossein Vahidi at the maintainer's instruction.
    AI systems are disclosed as tools, not authors.
fidelity:
  divergences: Actual integer teams use h=Nat.sqrt(d)+1 and clusters of size d*h. Opposed batch permutations
    replace the paper's sorted cyclic assignment and establish the required count and weighted load
    bounds, including a strict residual bound. The main protocol uses proved 2*D static routing; the
    exact regular D-round statement is separately proved. Main is a scalar-message theorem and public
    preprocessing is represented by finite classical choices. Wire proves per-round codec preservation,
    but does not supply an O(log n) encoding or a fully composed encoded program. Additional details,
    parameter ranges and source correspondence are in docs/coverage.md.
review:
  status: Independent AI correspondence review; fresh mechanical verification recorded separately
  reviewers:
  - Codex paper and mathematical-construction reviewer (AI)
  - Codex finite load and operational-interface reviewers (AI)
  notes: See docs/correspondence-review.md and docs/coverage.md for the independent AI correspondence
    review. The release commit 76a5a6a73fdc9f3f1fe02d1d2e4664d4f802467d passed GitHub Actions run
    42969947794 and was archived in Zenodo on 11 November 2026 as version 1.0.0. docs/release.md
    records the DOI, source commit and archive verification. Code licensing and the three-author
    attribution were selected by the maintainer. The files in paper/ retain the separate manuscript
    rights notice.
